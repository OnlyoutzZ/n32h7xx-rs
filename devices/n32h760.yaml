# devices/n32h760.yaml
# N32H760 的 svdtools 补丁文件
#
# 厂商 DFP (Nationstech.N32H7xx_DFP.1.3.0) 只提供一个 SVD：svd/N32H7xx.svd，
# 覆盖 N32H730/735/760/762/765/785/787 全系列，因此各设备 YAML 的 _svd 指向同一文件。

_svd: "../svd/vendor/N32H7xx.svd"

_include:
  - "patches/common.yaml"

# GPIOB..GPIOK 均 derivedFrom GPIOA，补 GPIOA 即可覆盖全部端口
GPIOA:
  _include:
    - "fields/gpio.yaml"
    - "collect/gpio.yaml"

_modify:
  version: "1.0.0"
  description: "N32H760 Cortex-M7 MCU"

# 根据校验报告的结果，按需添加修复
# 例如，如果发现地址冲突：
# _modify:
#   _peripherals:
#     GPIOA:
#       baseAddress: 0x40010000
