# devices/n32h785.yaml
# N32H785 的 svdtools 补丁文件
#
# 厂商 DFP (Nationstech.N32H7xx_DFP.1.3.0) 只提供一个 SVD：svd/N32H7xx.svd，
# 覆盖 N32H730/735/760/762/765/785/787 全系列，因此各设备 YAML 的 _svd 指向同一文件。
#
# N32H78x 是双核（CM7 + CM4）：
#   - 两个核共用一个 SVD；SVD 中外设按属主核分组（M7*/M4* 前缀寄存器等）。
#   - 释放 CM4 需要先写 M4_BOOT_ADDR，再置 M4RSTREL（真板实测）。

_svd: "../svd/vendor/N32H7xx.svd"

_include:
  - "patches/common.yaml"

# GPIOB..GPIOK 均 derivedFrom GPIOA，补 GPIOA 即可覆盖全部端口
GPIOA:
  _include:
    - "fields/gpio.yaml"
    - "collect/gpio.yaml"

_modify:
  version: "1.0.0"
  description: "N32H785 Cortex-M7/M4 dual-core MCU"

# 根据校验报告的结果，按需添加修复
